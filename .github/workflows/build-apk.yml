name: Build APK

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk GlassLauncher.apk
          cp larp/build/outputs/apk/release/larp-release.apk LarpVault.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GlassLauncher-apk
          path: |
            GlassLauncher.apk
            LarpVault.apk


  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: GlassLauncher-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get install -y -qq imagemagick >/dev/null || true

      - name: Run launcher on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash .github/smoke-test.sh

      - name: Attach screenshots to a test release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd shots && zip -q -r ../smoke-api${{ matrix.api }}.zip .) || exit 0
          TAG="smoke-${GITHUB_REF_NAME//\//-}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
            --title "Emulator test screenshots – ${GITHUB_REF_NAME}" --notes "Automated screenshots and logs from the emulator smoke test." || true
          gh release upload "$TAG" smoke-api${{ matrix.api }}.zip --clobber

  publish:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GlassLauncher-apk

      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="apk-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" GlassLauncher.apk LarpVault.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Glass Launcher – ${GITHUB_REF_NAME} (build ${GITHUB_RUN_NUMBER})" \
            --notes "**LarpVault.apk** is the demo balance display app. Download **GlassLauncher.apk** below and open it on your Android phone (Android 8.0+). Liquid glass refraction needs Android 13+; older versions get a frosted fallback."

